<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-layer"></div>

    <header class="shell-header">
      <div class="brand">
        <p class="brand-kicker">Engenharia de Software II</p>
        <h1>Order Management System</h1>
      </div>

      <nav class="menu" aria-label="Menu principal">
        <button class="menu-link is-active" data-view="dashboard">
          Dashboard
        </button>
        <button class="menu-link" data-view="pedidos">Pedidos</button>
        <button class="menu-link" data-view="produtos">Produtos</button>
      </nav>
    </header>

    <main class="shell-main">
      <section id="content" class="content"></section>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>

    <footer class="shell-footer">
      <p>Projeto acadêmico com Spring Boot, JPA e MySQL.</p>
      <p>Autores: Felipe Barros e Vitor Gomes</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
